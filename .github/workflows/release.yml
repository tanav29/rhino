name: Release Rhino

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win-x64
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Validate release version
        run: |
          bun -e '
            import config from "./electrobun.config.ts";
            import pkg from "./package.json";
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag ?? "")) {
              throw new Error("Stable releases require a vX.Y.Z tag");
            }
            if (tag !== `v${pkg.version}` || config.app.version !== pkg.version) {
              throw new Error("Tag, package.json and electrobun.config.ts versions must match");
            }
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Hutch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'hutch-install.ps1'
          Invoke-WebRequest https://hutch.blackboard.sh/hutch/install.ps1 -OutFile $installer
          & $installer -Version 0.29.0 -NoModifyPath
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.hutch\bin"

      - name: Install Hutch on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh -o "$RUNNER_TEMP/hutch-install.sh"
          sh "$RUNNER_TEMP/hutch-install.sh" --version 0.29.0 --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Prepare pinned Electrobun devkit
        run: bun run prepare:desktop

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test ./tests

      - name: Build stable installer
        run: bun run build

      - name: Stage release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --verify-tag --draft --title "Rhino $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
